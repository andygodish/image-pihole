name: Release (upver)

on:
  push:
    branches: [main]
    # Updating a deployment pin must not generate another wrapper release.
    paths-ignore:
      - docker-compose.yaml
      - docker-compose.local.yaml

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/andygodish/pihole

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      is_release_merge: ${{ steps.classify.outputs.is_release_merge }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify push
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -qx version.txt; then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

  bump-and-pr:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.is_release_merge != 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Compute from main, not the pending release branch: repeated main pushes
      # should update the same proposed version until that release is merged.
      - name: Install upver
        run: |
          curl --fail --location --silent --show-error --output /usr/local/bin/upver \
            https://github.com/andygodish/upver/releases/download/v0.0.3/upver-linux-amd64
          chmod +x /usr/local/bin/upver
      - name: Generate version and changelog
        run: |
          upver --apply --changelog
          # upver v0.0.3 emits GitLab-style links; normalize them for GitHub.
          sed -i 's|https://github.com/andygodish/image-pihole/-/commit/|https://github.com/andygodish/image-pihole/commit/|g' CHANGELOG.md
      - name: Create or update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/upver
          title: 'chore(release): update version.txt + changelog'
          commit-message: 'chore(release): update version.txt + changelog'
          add-paths: |
            version.txt
            CHANGELOG.md

  build-and-push:
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.is_release_merge == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read release version
        id: version
        run: |
          RAW_VERSION=$(cat version.txt)
          VERSION="${RAW_VERSION#v}"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+-[0-9]+$'; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Validate local build before publishing
        run: |
          make config
          make build
          make test
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Renovate sees the git tag only after the corresponding image is available.
      - name: Create release tag after image publication
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
